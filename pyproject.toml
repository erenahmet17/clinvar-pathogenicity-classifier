[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinvar-pathogenicity-classifier"
version = "0.2.0"
description = "Reproducible ClinVar SNV research and prioritization demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2",
  "xgboost>=3.3,<4", "requests>=2.32,<3", "pyarrow>=18,<26",
  "matplotlib>=3.9,<4", "streamlit>=1.50,<2",
  "filelock>=3.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9", "nbclient>=0.10", "ipykernel>=6"]

[project.scripts]
clinvar = "clinvar_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: bundled model and app smoke tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
